version: '3.8'

services:
  # Database MySQL
  db:
    image: mysql:8.4.3
    container_name: simago_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Port default MySQL (3306) diubah ke 3307 di Host
      # Format: HOST_PORT:CONTAINER_PORT
      - "${DB_PORT_HOST:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # Backend Laravel (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simago_backend
    restart: always
    environment:
      # PENTING: Antar-container di dalam Docker Network TETAP menggunakan port internal 3306
      DB_HOST: db
      DB_PORT: "${DB_PORT_HOST:-3307}:3306"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - backend_assets:/var/www
    depends_on:
      - db
    networks:
      - app-network

  # Web Server Nginx khusus Laravel
  backend-web:
    image: nginx:alpine
    container_name: simago_backend_web
    restart: always
    ports:
      - "${APP_BACKEND_PORT:-8085}:80"
    volumes:
      - backend_assets:/var/www
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

  # Frontend React (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simago_frontend
    restart: always
    ports:
      - "${APP_FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  backend_assets:
